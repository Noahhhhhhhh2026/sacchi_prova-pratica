OBIETTIVO

Progetta con me, in Figma Design, una singola pagina case study responsive che racconti il mio progetto UX/UI come una storia della sezione fittizia “Student Stories” di GitHub.

“Student Stories” è il nome del sito ospitante. Il nome del mio progetto è il soggetto del case study, non il nome del sito ospitante.

Il risultato deve essere un mockup nativo e modificabile in Figma, da sviluppare successivamente con HTML, CSS e JavaScript vanilla. Non generare il sito, codice applicativo, applicazioni Figma Make o code layers.

In questo passaggio analizza le fonti e proponi il progetto. Non modificare il canvas.


